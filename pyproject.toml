[project]
name = "biblio-demon"
version = "0.1.0"
description = "Python managed bibliography with metadata-centered organization. Syncronizing local files and Zotero."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eric Lucero Gonzalez", email = "ericlucerog@gmail.com" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pylint>=3",   # incluye pyreverse para diagramas UML
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biblio_demon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes · I: orden de imports (reemplaza isort) · UP: sintaxis moderna · B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["biblio_demon"]
